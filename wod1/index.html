<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>WOD 1 — Sollte Fest 07</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="WOD 1 — Sollte Fest 07 Mundialista" />
  <meta name="theme-color" content="#0c4d35" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../wod/wod.css">
</head>
<body class="heat-page heat-page--wod-viewer heat-page--final">
  <div class="heat-layout">
    <section class="heat-panel heat-panel--athletes heat-panel--final" aria-labelledby="heatTitle">
      <div class="heat-panel__inner heat-panel__inner--final">
        <div class="heat-final-frame" aria-hidden="true">
          <span class="heat-final-corner heat-final-corner--tl"></span>
          <span class="heat-final-corner heat-final-corner--tr"></span>
          <span class="heat-final-corner heat-final-corner--bl"></span>
          <span class="heat-final-corner heat-final-corner--br"></span>
        </div>
        <header class="heat-header heat-header--final">
          <img
            src="../assets/sollte_logo_nombre_icono.png"
            alt="Sollte Fest"
            class="heat-logo heat-logo--final"
            onerror="this.style.display='none'"
          />
          <p class="heat-eyebrow">Sollte Fest 07 — Mundialista</p>
          <p class="heat-wod-label" id="wodLabel">WOD #1</p>
          <p class="heat-final-label" id="heatFinal">WOD #1</p>
          <h1 class="heat-heat-num" id="heatTitle">HEAT 1</h1>
          <p class="heat-category" id="heatCategory">Pereira</p>
        </header>

        <div class="heat-matchup" id="heatMatchup"></div>

        <nav class="heat-pager heat-pager--final" aria-label="Navegación entre heats">
          <button type="button" id="heatPrev" class="heat-pager__btn" aria-label="Heat anterior">‹</button>
          <span class="heat-pager__indicator" id="heatIndicator">1 / 1</span>
          <button type="button" id="heatNext" class="heat-pager__btn" aria-label="Heat siguiente">›</button>
        </nav>
      </div>
    </section>

    <section class="heat-panel heat-panel--wod" aria-label="WOD">
      <div class="heat-wod-frame">
        <img src="./wod1.jpeg" alt="WOD #1" />
      </div>
    </section>
  </div>

  <script src="../wod/wod.js"></script>
</body>
</html>
