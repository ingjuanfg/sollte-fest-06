<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Final — Sollte Fest 07</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Final — Sollte Fest 07 — Mundialista" />
  <meta name="theme-color" content="#0c4d35" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../heat/heat.css">
</head>
<body class="heat-page heat-page--final">
  <div class="heat-layout">
    <section class="heat-panel heat-panel--athletes" aria-labelledby="heatTitle">
      <div class="heat-panel__inner">
        <header class="heat-header">
          <img
            src="../assets/sollte_logo_nombre_icono.png"
            alt="Sollte Fest"
            class="heat-logo"
            onerror="this.style.display='none'"
          />
          <p class="heat-eyebrow">Sollte Fest 07 — Mundialista</p>
          <p class="heat-final-label" id="heatFinal">FINAL</p>
          <h1 class="heat-heat-num" id="heatTitle">HEAT 1</h1>
          <p class="heat-category" id="heatCategory">Categoría</p>
        </header>

        <div class="heat-matchup" id="heatMatchup"></div>

        <section class="heat-sponsors" aria-label="Patrocinadores">
          <p class="heat-sponsors__title">Nuestros Patrocinadores</p>
          <div class="heat-sponsors__grid" id="heatSponsorsGrid"></div>
        </section>
      </div>
    </section>

    <section class="heat-panel heat-panel--wod" aria-label="WOD del heat">
      <div class="heat-wod-frame">
        <img
          src="../assets/wods/wod1.jpeg"
          alt="WOD #1 — Partido Inaugural. Time cap 11 min: 1.000 mts Row, 30 Thruster, 30 burpees over bar"
        />
      </div>
    </section>
  </div>

  <script src="../heat/heat.js"></script>
</body>
</html>
