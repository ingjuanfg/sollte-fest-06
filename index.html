<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sollte Fest 07 - Mundialista</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Resultados en tiempo real de Sollte Fest 07 - Mundialista" />
  <meta name="theme-color" content="#0c4d35" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="hero-logo">
          <img src="assets/sollte_logo_nombre_icono.png" alt="Sollte Fest" onerror="this.style.display='none'" />
        </div>
        <h2 class="hero-title">Sollte Fest 07 - Mundialista</h2>
      </div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <h3 class="results-title">Resultados</h3>
        <div class="results-controls">
          <div class="categoria-picker" id="categoriaPicker">
            <span class="categoria-picker__label" id="categoriaLabel">Categoría</span>
            <div class="categoria-picker__wrap">
              <button
                type="button"
                class="categoria-picker__trigger"
                id="categoriaTrigger"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-labelledby="categoriaLabel categoriaValue"
              >
                <span class="categoria-picker__value" id="categoriaValue">—</span>
                <span class="categoria-picker__icon" aria-hidden="true">▾</span>
              </button>
              <ul class="categoria-picker__menu" id="categoriaMenu" role="listbox" hidden></ul>
            </div>
            <select id="categoriaSelect" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
          </div>
          <label class="inline" for="recalcularTotal">
            <input type="checkbox" id="recalcularTotal" /> Recalcular Total
          </label>
          <button id="reloadBtn" title="Recargar datos" aria-label="Recargar datos">⟳</button>
        </div>
      </div>
      
      <div class="table-wrapper">
        <div id="loadingIndicator" style="display: none; text-align: center; padding: 2rem; color: var(--text-secondary);">
          <div style="font-size: 1.2rem; margin-bottom: 0.5rem;">Cargando datos...</div>
          <div style="font-size: 0.8rem;">Por favor espera</div>
        </div>
        <table id="tablaResultados">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="update-info">
          <span id="lastUpdate">—</span>
        </div>
      </div>
    </section>

    <section class="patrocinadores-section">
      <h3 class="patrocinadores-title">Nuestros Patrocinadores</h3>
      <div class="patrocinadores-grid" id="patrocinadoresGrid"></div>
    </section>
  </main>

  <footer>
    <small>© <span id="year"></span> Sollte Fest. Rankings actualizados en tiempo real.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
